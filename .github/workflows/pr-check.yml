name: PR check

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  source-branch:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # Required check: main only takes PRs from rc/* branches of this repo, never forks.
      - env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REF" != rc/* || "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::main only takes PRs from rc/* branches of $GITHUB_REPOSITORY (got $HEAD_REPO:$HEAD_REF)"
            exit 1
          fi

  pr-check:
    runs-on: ubuntu-latest
    steps:
      # Required check: the PR title and body become the merge commit, so they follow the commit style.
      - env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          (( ${#TITLE} <= 72 )) || fail "title is over 72 characters"
          [[ "$TITLE" =~ ^[A-Z] ]] || fail "title must start with a capital letter"
          [[ "$TITLE" != *. ]] || fail "title must not end with a period"
          [[ "${TITLE^^}" != WIP* ]] || fail "title must not start with WIP"
          [[ -n "${BODY//[[:space:]]/}" ]] || fail "body must not be empty"
