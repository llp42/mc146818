name: Lint

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Reads .markdownlint-cli2.jsonc: 120 columns at most, tables aligned.
      - run: npx --yes markdownlint-cli2@0.24.2

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The toolchain CI pins, in .github/actions/setup-rust.
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      # Cargo.toml sets the lints, pedantic and nursery included, to warn, so that a newer toolchain, on docs.rs or in a
      # path dependency, only warns. CI denies every warning.
      - run: cargo clippy --all-targets --locked -- -D warnings
