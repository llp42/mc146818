name: Lint

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Reads .markdownlint-cli2.jsonc: 120 columns at most, tables aligned.
      - run: npx --yes markdownlint-cli2@0.24.2

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component clippy
      # The lint levels, pedantic and nursery included, are in Cargo.toml.
      - run: cargo clippy --all-targets --locked
